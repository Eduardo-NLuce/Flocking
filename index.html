<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWARM_OS // Autonomous Agent Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Canvas principal -->
    <canvas id="swarm-canvas"></canvas>

    <!-- Botón flotante independiente -->
    <button id="btn-toggle-hud" class="hud-toggle-btn">_ MINIMIZE</button>

    <!-- Panel de control HUD -->
    <div id="hud-container">
        <div id="hud-content">
            <div class="hud-header">
                <h2>SWARM_INTELLIGENCE // v2.5</h2>
                <p id="agent-counter">ACTIVE AGENTS: 160</p>
            </div>

            <hr class="hud-divider">
            <p class="hud-instruction">> CLICK & DRAG MOUSE TO DRAW OBSTACLE WALLS</p>
            <hr class="hud-divider">

            <!-- Sliders de comportamiento -->
            <div class="control-group">
                <label class="hud-label">SEPARATION / AVOIDANCE (<span id="val-sep">1.5</span>)</label>
                <input type="range" id="slider-sep" min="0.0" max="3.0" step="0.1" value="1.5">
            </div>

            <div class="control-group">
                <label class="hud-label">ALIGNMENT / MATCHING (<span id="val-ali">1.0</span>)</label>
                <input type="range" id="slider-ali" min="0.0" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label class="hud-label">COHESION / ATTRACTION (<span id="val-coh">1.0</span>)</label>
                <input type="range" id="slider-coh" min="0.0" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label class="hud-label">PERCEPTION RADIUS (<span id="val-percepcion">50</span> px)</label>
                <input type="range" id="slider-percepcion" min="15" max="150" step="5" value="50">
            </div>

            <button id="btn-clear-walls" class="hud-button" style="margin-bottom: 8px;">CLEAR WALLS</button>
            <button id="btn-reset" class="hud-button">RESET SWARM</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

    <script src="app.js"></script>
</body>
</html>
